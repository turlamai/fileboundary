name: Windows Racket core

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  racket-core:
    name: Racket CS 9.3 / Windows x64
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: "9.3"
      - name: Compile headless engine and CLI
        run: raco make src/engine/inventory.rkt src/engine/diagnostics.rkt src/engine/summary.rkt src/engine/recovery.rkt src/cli.rkt
      - name: Run real unit and contract tests
        run: raco test tests/inventory-test.rkt tests/diagnostics-test.rkt tests/cli-test.rkt tests/real-wrapper-baseline-test.rkt tests/summary-test.rkt tests/recovery-test.rkt tests/recovery-twin-baseline-test.rkt tests/version-test.rkt
      - name: JSON Schema contract tests (real CLI process)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
          if ($LASTEXITCODE -ne 0) { throw "jsonschema dependency failed" }
          python tests/validate_contract.py
          if ($LASTEXITCODE -ne 0) { throw "CLI schema contract failed" }
      - name: CLI process smoke (real Windows process)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = racket src/cli.rkt version | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          if ($json.schemaVersion -ne '1.0' -or $json.status -ne 'ok') { throw "unexpected envelope" }
          $bad = racket src/cli.rkt scan | ConvertFrom-Json
          if ($LASTEXITCODE -ne 2 -or $bad.status -ne 'error') { throw "usage errors not reflected in exit code" }
          $doctor = racket src/cli.rkt doctor | ConvertFrom-Json
          $doctorExit = $LASTEXITCODE
          if ($doctorExit -notin @(0, 1)) { throw "doctor command failed unexpectedly" }
          if ($doctor.data.scope -ne "read-only-diagnostics") { throw "unexpected doctor scope" }
          Write-Output "version, doctor, and usage JSON smoke passed"
          # Earlier expected nonzero child exit is not the job exit status.
          exit 0
