name: Rivet WinUI 3 feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rivet-winui-spike.yml"
      - "docs/rivet-winui-spike.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-native-spike:
    name: Real Rivet generated WinUI 3 build
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: "9.3"
      - name: Install pinned Rivet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#v0.14.0'
          if ($LASTEXITCODE -ne 0) { throw "Rivet install failed" }
      - name: Generate disposable native Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          raco rivet new fb-rivet-spike
          if ($LASTEXITCODE -ne 0) { throw "Rivet scaffold creation failed" }
      - name: Inspect schema and native prerequisites
        shell: pwsh
        working-directory: fb-rivet-spike
        run: |
          $ErrorActionPreference = "Stop"
          raco rivet inspect --json
          if ($LASTEXITCODE -ne 0) { throw "Rivet project inspect failed" }
          raco rivet doctor --json
          if ($LASTEXITCODE -ne 0) { throw "Rivet doctor failed" }
      - name: Compile real WinUI 3 host and embedded Racket backend
        shell: pwsh
        working-directory: fb-rivet-spike
        run: |
          $ErrorActionPreference = "Stop"
          raco rivet build
          if ($LASTEXITCODE -ne 0) { throw "Native host build failed" }
      - name: Check developmental package and layout
        shell: pwsh
        working-directory: fb-rivet-spike
        run: |
          $ErrorActionPreference = "Stop"
          raco rivet package
          if ($LASTEXITCODE -ne 0) { throw "Rivet development package failed" }
          raco rivet verify
          if ($LASTEXITCODE -ne 0) { throw "Rivet package verification failed" }
